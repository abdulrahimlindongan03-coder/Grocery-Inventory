<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid Prayer Times Management System</title>
    <!-- Import Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
        }

        body {
            background-color: #0f172a; 
            background-image: url('masjidbg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-edit {
            background: #3b82f6;
        }
        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #475569;
        }
        .btn-secondary:hover {
            background: #334155;
        }

        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .masjid-card {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .card-content-overlay {
            background: rgba(30, 41, 59, 0.7); 
            width: 100%;
            height: 100%;
        }

        .card-header {
            background: linear-gradient(135deg, rgba(6, 95, 70, 0.9), rgba(4, 120, 87, 0.9));
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .card-header h3 {
            font-size: 1.2rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .card-actions {
            display: flex;
            gap: 5px;
        }
        
        .card-actions button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .card-actions button:hover {
            background: rgba(255,255,255,0.4);
        }

        .mini-table {
            width: 100%;
            border-collapse: collapse;
        }

        .mini-table th, .mini-table td {
            padding: 10px 15px;
            font-size: 0.9rem;
            border-bottom: 1px solid #334155;
            text-align: left;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .mini-table th {
            background: rgba(40, 53, 72, 0.7);
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .mini-table td:not(:first-child) {
            color: #38bdf8;
        }

        .form-container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            max-width: 700px;
            margin: 0 auto;
        }

        .form-container h2 {
            margin-bottom: 20px;
            color: #f8fafc;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
        }

        #masjidName {
            text-transform: uppercase;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #10b981;
        }

        .prayer-row-input {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            align-items: center;
            background: #253348;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .prayer-row-input span {
            color: #e2e8f0;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 30px;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #64748b;
            grid-column: 1 / -1;
            font-size: 1.1rem;
        }

        #bgReminder {
            color: #38bdf8;
            font-size: 0.85rem;
            margin-top: 8px;
            display: block;
        }

        /* Crop Container Styles */
        .crop-wrapper {
            display: none;
            margin-top: 15px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #38bdf8;
        }

        .crop-container {
            max-height: 350px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .crop-preview {
            max-width: 100%;
            display: block;
        }

        @media (max-width: 768px) {
            body {
                background-image: url('masjidbg-mobile.png');
                background-position: top center;
                padding: 10px;
            }

            .app-container {
                background: rgba(15, 23, 42, 0.85); 
                padding: 15px;
            }

            header {
                flex-direction: column;
                text-align: center;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .prayer-row-input {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header with Backup/Restore Features -->
        <header>
            <h1>🕌 Masjid Prayer Times Hub</h1>
            <div class="header-actions">
                <button class="btn" onclick="openCreateView()">+ Create New Schedule</button>
                <button class="btn btn-secondary" onclick="exportBackup()">Export Data Backup</button>
                <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Import Data</button>
                <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importBackup(event)">
            </div>
        </header>

        <!-- VIEW 1: DASHBOARD -->
        <div id="dashboard-view" class="view active">
            <div id="masjid-grid" class="dashboard-grid"></div>
        </div>

        <!-- VIEW 2: FORM -->
        <div id="create-view" class="view">
            <div class="form-container">
                <h2 id="formTitle">Create Masjid Prayer Schedule</h2>
                <form id="scheduleForm" onsubmit="saveMasjidSchedule(event)">
                    <input type="hidden" id="editMasjidId" value="">
                    
                    <div class="form-group">
                        <label for="masjidName">Masjid Name</label>
                        <input type="text" id="masjidName" placeholder="E.G., AL-NOOR ISLAMIC CENTER" required>
                    </div>

                    <div class="form-group">
                        <label for="bgDevice">Schedule Target Layout</label>
                        <select id="bgDevice" onchange="updateBgReminder()" required>
                            <option value="">-- Choose Layout For Background --</option>
                            <option value="desktop">Desktop</option>
                            <option value="mobile">Mobile</option>
                        </select>
                        <small id="bgReminder"></small>
                    </div>

                    <!-- Optional Background Image Upload & Cropper -->
                    <div class="form-group">
                        <label for="bgImage">Background Image (Optional)</label>
                        <input type="file" id="bgImage" accept="image/*" onchange="handleImageSelection(event)">
                        <input type="hidden" id="existingBgImage" value=""> 
                        <button type="button" id="removeImgBtn" class="btn btn-danger" style="display:none; margin-top:8px; font-size:0.8rem;" onclick="clearBgImage()">Remove Image</button>

                        <div id="cropWrapper" class="crop-wrapper">
                            <div class="crop-container">
                                <img id="cropImage" class="crop-preview" src="">
                            </div>
                            <div style="display:flex; gap:10px;">
                                <button type="button" class="btn btn-edit" onclick="applyCrop()">Apply Crop & Save Image</button>
                                <button type="button" class="btn btn-secondary" onclick="cancelCrop()">Cancel Crop</button>
                            </div>
                        </div>
                    </div>

                    <label style="color: #94a3b8; margin-bottom: 10px; display: block;">Azan & Iqamah / Jama'at Times</label>
                    
                    <div id="prayerInputsContainer">
                        <!-- Fajr -->
                        <div class="prayer-row-input">
                            <span>Fajr</span>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Azan (Bang)</label>
                                <input type="time" name="fajr_azan" value="05:15" required>
                            </div>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Iqamah</label>
                                <input type="time" name="fajr_iqamah" value="05:30" required>
                            </div>
                        </div>

                        <!-- Dhuhr -->
                        <div class="prayer-row-input">
                            <span>Dhuhr</span>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Azan (Bang)</label>
                                <input type="time" name="dhuhr_azan" value="13:15" required>
                            </div>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Iqamah</label>
                                <input type="time" name="dhuhr_iqamah" value="13:30" required>
                            </div>
                        </div>

                        <!-- Asr -->
                        <div class="prayer-row-input">
                            <span>Asr</span>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Azan (Bang)</label>
                                <input type="time" name="asr_azan" value="16:45" required>
                            </div>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Iqamah</label>
                                <input type="time" name="asr_iqamah" value="17:00" required>
                            </div>
                        </div>

                        <!-- Maghrib -->
                        <div class="prayer-row-input">
                            <span>Maghrib</span>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Azan (Bang)</label>
                                <input type="time" name="maghrib_azan" value="19:30" required>
                            </div>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Iqamah</label>
                                <input type="time" name="maghrib_iqamah" value="19:35" required>
                            </div>
                        </div>

                        <!-- Isha -->
                        <div class="prayer-row-input">
                            <span>Isha</span>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Azan (Bang)</label>
                                <input type="time" name="isha_azan" value="20:50" required>
                            </div>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Iqamah</label>
                                <input type="time" name="isha_iqamah" value="21:00" required>
                            </div>
                        </div>

                        <!-- Jum'ah / Jama'at Addition -->
                        <div class="prayer-row-input">
                            <span>Jum'ah / Jama'at</span>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Azan (Khutbah)</label>
                                <input type="time" name="jumah_azan" value="12:30">
                            </div>
                            <div>
                                <label style="font-size: 0.75rem; color:#94a3b8">Jama'at</label>
                                <input type="time" name="jumah_iqamah" value="13:00">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="switchView('dashboard-view')">Cancel</button>
                        <button type="submit" class="btn">Save Schedule</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Cropper.js Library Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        let cropper = null;

        // Initialize localStorage safely
        let masjids = JSON.parse(localStorage.getItem('masjid_schedules')) || [
            {
                id: 1,
                name: "AL-NOOR ISLAMIC CENTER",
                device: "desktop",
                bgImage: "", 
                prayers: {
                    Fajr: { azan: "05:15 AM", iqamah: "05:30 AM" },
                    Dhuhr: { azan: "01:15 PM", iqamah: "01:30 PM" },
                    Asr: { azan: "04:45 PM", iqamah: "05:00 PM" },
                    Maghrib: { azan: "07:30 PM", iqamah: "07:35 PM" },
                    Isha: { azan: "08:50 PM", iqamah: "09:00 PM" },
                    "Jum'ah": { azan: "12:30 PM", iqamah: "01:00 PM" }
                }
            }
        ];

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (viewId === 'dashboard-view') {
                renderDashboard();
            }
        }

        function openCreateView() {
            document.getElementById('scheduleForm').reset();
            document.getElementById('editMasjidId').value = '';
            document.getElementById('existingBgImage').value = '';
            document.getElementById('formTitle').innerText = 'Create Masjid Prayer Schedule';
            document.getElementById('bgReminder').innerText = '';
            clearBgImage();
            switchView('create-view');
        }

        function updateBgReminder() {
            const device = document.getElementById('bgDevice').value;
            const reminder = document.getElementById('bgReminder');
            
            if (device === 'desktop') {
                reminder.innerText = "Preferred image size: 1920x1080 pixels (Landscape)";
            } else if (device === 'mobile') {
                reminder.innerText = "Preferred image size: 1080x1920 pixels (Portrait)";
            } else {
                reminder.innerText = "";
            }
        }

        /* Image Selection & Cropping Handlers */
        function handleImageSelection(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const cropImg = document.getElementById('cropImage');
                cropImg.src = event.target.result;
                document.getElementById('cropWrapper').style.display = 'block';

                if (cropper) cropper.destroy();

                const device = document.getElementById('bgDevice').value;
                const ratio = device === 'mobile' ? 9 / 16 : (device === 'desktop' ? 16 / 9 : NaN);

                cropper = new Cropper(cropImg, {
                    aspectRatio: ratio,
                    viewMode: 1,
                    autoCropArea: 0.8
                });
            };
            reader.readAsDataURL(file);
        }

        function applyCrop() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas();
            const croppedBase64 = canvas.toDataURL();
            document.getElementById('existingBgImage').value = croppedBase64;
            document.getElementById('removeImgBtn').style.display = 'inline-block';
            cancelCrop();
        }

        function cancelCrop() {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            document.getElementById('cropWrapper').style.display = 'none';
        }

        function clearBgImage() {
            cancelCrop();
            document.getElementById('bgImage').value = '';
            document.getElementById('existingBgImage').value = '';
            document.getElementById('removeImgBtn').style.display = 'none';
        }

        function formatTimeTo12Hour(time24) {
            if (!time24) return "-";
            let [hours, minutes] = time24.split(':');
            let h = parseInt(hours);
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            h = h ? h : 12; 
            return `${String(h).padStart(2, '0')}:${minutes} ${ampm}`;
        }
        
        function convert12HourTo24Hour(time12) {
            if (!time12 || time12 === "-") return "";
            const [time, modifier] = time12.split(' ');
            let [hours, minutes] = time.split(':');
            if (hours === '12') hours = '00';
            if (modifier === 'PM') hours = parseInt(hours, 10) + 12;
            return `${String(hours).padStart(2, '0')}:${minutes}`;
        }

        async function saveMasjidSchedule(e) {
            e.preventDefault();

            const name = document.getElementById('masjidName').value.toUpperCase();
            const device = document.getElementById('bgDevice').value;
            const editId = document.getElementById('editMasjidId').value;
            const bgImageData = document.getElementById('existingBgImage').value; 
            
            const scheduleData = {
                id: editId ? parseInt(editId) : Date.now(),
                name: name,
                device: device,
                bgImage: bgImageData,
                prayers: {
                    Fajr: { 
                        azan: formatTimeTo12Hour(document.querySelector('[name="fajr_azan"]').value), 
                        iqamah: formatTimeTo12Hour(document.querySelector('[name="fajr_iqamah"]').value) 
                    },
                    Dhuhr: { 
                        azan: formatTimeTo12Hour(document.querySelector('[name="dhuhr_azan"]').value), 
                        iqamah: formatTimeTo12Hour(document.querySelector('[name="dhuhr_iqamah"]').value) 
                    },
                    Asr: { 
                        azan: formatTimeTo12Hour(document.querySelector('[name="asr_azan"]').value), 
                        iqamah: formatTimeTo12Hour(document.querySelector('[name="asr_iqamah"]').value) 
                    },
                    Maghrib: { 
                        azan: formatTimeTo12Hour(document.querySelector('[name="maghrib_azan"]').value), 
                        iqamah: formatTimeTo12Hour(document.querySelector('[name="maghrib_iqamah"]').value) 
                    },
                    Isha: { 
                        azan: formatTimeTo12Hour(document.querySelector('[name="isha_azan"]').value), 
                        iqamah: formatTimeTo12Hour(document.querySelector('[name="isha_iqamah"]').value) 
                    },
                    "Jum'ah": {
                        azan: formatTimeTo12Hour(document.querySelector('[name="jumah_azan"]').value),
                        iqamah: formatTimeTo12Hour(document.querySelector('[name="jumah_iqamah"]').value)
                    }
                }
            };

            if (editId) {
                const index = masjids.findIndex(m => m.id === parseInt(editId));
                if (index !== -1) masjids[index] = scheduleData;
            } else {
                masjids.push(scheduleData);
            }

            localStorage.setItem('masjid_schedules', JSON.stringify(masjids));
            document.getElementById('scheduleForm').reset();
            clearBgImage();
            switchView('dashboard-view');
        }

        function editMasjid(id) {
            const masjid = masjids.find(m => m.id === id);
            if (!masjid) return;

            document.getElementById('formTitle').innerText = 'Edit Masjid Prayer Schedule';
            document.getElementById('editMasjidId').value = masjid.id;
            document.getElementById('masjidName').value = masjid.name;
            document.getElementById('bgDevice').value = masjid.device || 'desktop';
            document.getElementById('existingBgImage').value = masjid.bgImage || '';
            
            if (masjid.bgImage) {
                document.getElementById('removeImgBtn').style.display = 'inline-block';
            } else {
                document.getElementById('removeImgBtn').style.display = 'none';
            }

            updateBgReminder();

            document.querySelector('[name="fajr_azan"]').value = convert12HourTo24Hour(masjid.prayers.Fajr.azan);
            document.querySelector('[name="fajr_iqamah"]').value = convert12HourTo24Hour(masjid.prayers.Fajr.iqamah);
            
            document.querySelector('[name="dhuhr_azan"]').value = convert12HourTo24Hour(masjid.prayers.Dhuhr.azan);
            document.querySelector('[name="dhuhr_iqamah"]').value = convert12HourTo24Hour(masjid.prayers.Dhuhr.iqamah);
            
            document.querySelector('[name="asr_azan"]').value = convert12HourTo24Hour(masjid.prayers.Asr.azan);
            document.querySelector('[name="asr_iqamah"]').value = convert12HourTo24Hour(masjid.prayers.Asr.iqamah);
            
            document.querySelector('[name="maghrib_azan"]').value = convert12HourTo24Hour(masjid.prayers.Maghrib.azan);
            document.querySelector('[name="maghrib_iqamah"]').value = convert12HourTo24Hour(masjid.prayers.Maghrib.iqamah);
            
            document.querySelector('[name="isha_azan"]').value = convert12HourTo24Hour(masjid.prayers.Isha.azan);
            document.querySelector('[name="isha_iqamah"]').value = convert12HourTo24Hour(masjid.prayers.Isha.iqamah);

            if (masjid.prayers["Jum'ah"]) {
                document.querySelector('[name="jumah_azan"]').value = convert12HourTo24Hour(masjid.prayers["Jum'ah"].azan);
                document.querySelector('[name="jumah_iqamah"]').value = convert12HourTo24Hour(masjid.prayers["Jum'ah"].iqamah);
            }

            switchView('create-view');
        }

        function deleteMasjid(id) {
            if (confirm("Are you sure you want to delete this masjid schedule?")) {
                masjids = masjids.filter(m => m.id !== id);
                localStorage.setItem('masjid_schedules', JSON.stringify(masjids));
                renderDashboard();
            }
        }

        function renderDashboard() {
            const grid = document.getElementById('masjid-grid');
            grid.innerHTML = '';

            if (masjids.length === 0) {
                grid.innerHTML = `<div class="empty-state">No masjid schedules found. Click "+ Create New Schedule" to add one.</div>`;
                return;
            }

            masjids.forEach(masjid => {
                let rows = '';
                for (const [prayer, times] of Object.entries(masjid.prayers)) {
                    rows += `
                        <tr>
                            <td><strong>${prayer}</strong></td>
                            <td>${times.azan}</td>
                            <td>${times.iqamah}</td>
                        </tr>
                    `;
                }
                
                const bgStyle = masjid.bgImage ? `background-image: url('${masjid.bgImage}');` : '';

                const card = document.createElement('div');
                card.className = 'masjid-card';
                card.style = bgStyle;
                card.innerHTML = `
                    <div class="card-content-overlay">
                        <div class="card-header">
                            <h3>${masjid.name}</h3>
                            <div class="card-actions">
                                <button class="btn-edit" onclick="editMasjid(${masjid.id})">Edit</button>
                                <button class="btn-danger" onclick="deleteMasjid(${masjid.id})">Delete</button>
                            </div>
                        </div>
                        <table class="mini-table">
                            <thead>
                                <tr>
                                    <th>Prayer</th>
                                    <th>Azan</th>
                                    <th>Jama'at</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        /* Export / Import Features for Safe Data Persistence */
        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(masjids, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "masjid_schedules_backup.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importBackup(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (Array.isArray(importedData)) {
                        masjids = importedData;
                        localStorage.setItem('masjid_schedules', JSON.stringify(masjids));
                        renderDashboard();
                        alert('Data successfully restored!');
                    } else {
                        alert('Invalid backup file format.');
                    }
                } catch (err) {
                    alert('Error reading backup JSON file.');
                }
            };
            reader.readAsText(file);
        }

        renderDashboard();
    </script>
