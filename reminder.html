<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RML Reminder</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0c14;
            --card-bg: rgba(18, 22, 36, 0.65);
            --border-glow: rgba(0, 242, 254, 0.25);
            --accent-cyan: #00f2fe;
            --accent-violet: #4facfe;
            --accent-purple: #7f00ff;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Neon Animated Mesh Background */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 50vw;
            height: 50vw;
            min-width: 500px;
            min-height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            animation: pulseGlow 10s infinite alternate;
        }

        body::before {
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            top: -10%;
            left: -10%;
        }

        body::after {
            background: radial-gradient(circle, var(--accent-cyan), transparent 70%);
            bottom: -10%;
            right: -10%;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(50px, 30px); opacity: 0.9; }
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(0, 242, 254, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 25px 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 6px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple));
            color: white;
            box-shadow: 0 8px 20px rgba(127, 0, 255, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(127, 0, 255, 0.5);
        }

        .btn-cyan {
            background: linear-gradient(135deg, #4facfe, var(--accent-cyan));
            color: #000;
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
        }
        .btn-cyan:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 242, 254, 0.5);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-cyan);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .section-card {
            padding: 25px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-cyan);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            resize: vertical;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row > div {
            flex: 1;
        }

        /* Added Loader CSS */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--accent-cyan);
            font-weight: 600;
            gap: 15px;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 242, 254, 0.1);
            border-top: 4px solid var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .reminder-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            transition: 0.2s;
            gap: 12px;
        }

        .reminder-item.completed {
            opacity: 0.5;
            border-color: rgba(46, 213, 115, 0.3);
            background: rgba(46, 213, 115, 0.05);
        }

        .reminder-item.completed .item-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .item-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            overflow: hidden;
            flex: 1;
        }

        .item-left input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 3px;
            accent-color: var(--accent-cyan);
            cursor: pointer;
            flex-shrink: 0;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            word-break: break-word;
        }

        .item-text {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .item-sub {
            font-size: 0.82rem;
            color: var(--accent-cyan);
            font-weight: 500;
        }

        .item-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
            white-space: pre-wrap;
        }

        .badge-overlapse {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 8px;
            font-weight: 700;
            vertical-align: middle;
        }

        .btn-delete {
            background: rgba(255, 71, 87, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 71, 87, 0.3);
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background: rgba(18, 22, 36, 0.95);
            border: 1px solid var(--accent-cyan);
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 14px 24px;
            position: fixed;
            z-index: 2000;
            left: 50%;
            top: 20px;
            transform: translateX(-50%) translateY(-20px);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .form-row { flex-direction: column; }
        }

        /* FIXED CSS: Positioned off-screen, solid background, NO opacity: 0 */
        #pdf-template-container {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 750px;
            background-color: #ffffff;
            color: #000000;
            padding: 40px;
            font-family: 'Times New Roman', Times, serif !important;
            pointer-events: none;
        }

        #pdf-template-container * {
            font-family: 'Times New Roman', Times, serif !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="glass">
            <div>
                <h1>RML Reminder Hub</h1>
                <p style="color: var(--text-muted); font-weight: 300; font-size: 0.9rem;">Manage your active payments & tasks seamlessly</p>
            </div>
            
            <div class="header-actions">
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;" onchange="importFromCSV(event)">
                <button class="btn btn-back" onclick="document.getElementById('csvFileInput').click()">📁 Import CSV</button>
                <button class="btn btn-back" onclick="exportToCSV()">📤 Export CSV</button>
                
                <button class="btn btn-cyan" onclick="generateReceipt('pdf')">📥 Save as PDF</button>
                <button class="btn btn-primary" onclick="generateReceipt('jpg')">🖼️ Save as JPG</button>
                
                <a href="index.html" class="btn btn-back">🏠 Back to Dashboard</a>
            </div>
        </header>

        <div class="main-grid">
            
            <div class="glass section-card">
                <div class="section-title">💳 Payment Reminders</div>
                <form id="payment-form" onsubmit="addReminder(event, 'payment')">
                    <div class="form-group">
                        <label>Payment Title / Item</label>
                        <input type="text" id="pay-title" placeholder="e.g. Internet Bill, Rent" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Amount (₱)</label>
                            <input type="number" step="0.01" id="pay-amount" placeholder="e.g. 1500" required>
                        </div>
                        <div class="form-group">
                            <label>Due Date & Time</label>
                            <input type="datetime-local" id="pay-datetime" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description / Reminder Notes</label>
                        <textarea id="pay-desc" rows="2" placeholder="e.g. Pay via Online Banking account #1234"></textarea>
                    </div>
                    <button type="submit" class="btn btn-cyan" style="width: 100%;">+ Add Payment Reminder</button>
                </form>

                <div class="items-list" id="payments-list">
                    </div>
            </div>

            <div class="glass section-card">
                <div class="section-title">📌 Activity Reminders</div>
                <form id="activity-form" onsubmit="addReminder(event, 'activity')">
                    <div class="form-group">
                        <label>Activity Task</label>
                        <input type="text" id="act-title" placeholder="e.g. Server Backup, Team Sync" required>
                    </div>
                    <div class="form-group">
                        <label>Schedule / Time</label>
                        <input type="datetime-local" id="act-datetime" required>
                    </div>
                    <div class="form-group">
                        <label>Description / Reminder Notes</label>
                        <textarea id="act-desc" rows="2" placeholder="e.g. Bring quarterly server log reports"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">+ Add Activity Task</button>
                </form>

                <div class="items-list" id="activities-list">
                    </div>
            </div>

        </div>
    </div>

    <div id="pdf-template-container">
        <div style="display: flex; align-items: center; justify-content: center; gap: 15px; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px;">
            <div style="text-align: center;">
                <h2 style="font-size: 26px; font-weight: bold; margin-bottom: 5px;">RML PARTNER HUB</h2>
                <h3 style="font-size: 18px; font-weight: normal; margin: 0;">Official Reminders Summary Report</h3>
                <p id="pdf-timestamp" style="font-size: 12px; margin-top: 5px; color: #444;"></p>
            </div>
        </div>

        <div style="margin-bottom: 25px;">
            <h4 style="font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 10px; text-transform: uppercase;">Payment Reminders (PHP)</h4>
            <div id="pdf-payments-list" style="font-size: 14px; line-height: 1.6;"></div>
        </div>

        <div style="margin-bottom: 15px;">
            <h4 style="font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 10px; text-transform: uppercase;">Activity Reminders</h4>
            <div id="pdf-activities-list" style="font-size: 14px; line-height: 1.6;"></div>
        </div>

        <div style="text-align: center; margin-top: 40px; font-size: 11px; border-top: 1px dashed #999; padding-top: 10px; color: #666;">
            Generated securely via RML Reminder System
        </div>
    </div>

    <div id="toast">Saved Successfully!</div>

    <script>
        // Loading State Initialization
        let isInitialLoad = true;
        let remindersData = JSON.parse(localStorage.getItem('rml_reminders_v2')) || { payments: [], activities: [] };

        // 5-Second Delay Before Showing Items
        setTimeout(() => {
            isInitialLoad = false;
            renderReminders();
        }, 5000);

        function saveData() {
            localStorage.setItem('rml_reminders_v2', JSON.stringify(remindersData));
            renderReminders();
        }

        function checkAutoDelete() {
            const now = new Date().getTime();
            const fiveHoursMs = 5 * 60 * 60 * 1000;
            let dataChanged = false;
            
            ['payments', 'activities'].forEach(type => {
                remindersData[type] = remindersData[type].filter(item => {
                    if (item.completed) return true; // Keep completed items
                    
                    const itemTime = new Date(item.datetime).getTime();
                    // Auto-delete if it has passed 5 hours from target time
                    if (now >= (itemTime + fiveHoursMs)) {
                        dataChanged = true;
                        return false; 
                    }
                    return true;
                });
            });

            if (dataChanged) {
                saveData();
                showToast("Tasks 5+ hours old were auto-deleted!");
            }
        }

        checkAutoDelete();
        setInterval(() => {
            checkAutoDelete();
            if (!isInitialLoad) renderReminders();
        }, 10000);

        function addReminder(event, type) {
            event.preventDefault();
            if (type === 'payment') {
                const title = document.getElementById('pay-title').value.trim();
                const amount = document.getElementById('pay-amount').value.trim();
                const datetime = document.getElementById('pay-datetime').value;
                const description = document.getElementById('pay-desc').value.trim();
                
                remindersData.payments.push({
                    id: 'pay_' + Date.now(),
                    title: title,
                    amount: amount,
                    datetime: datetime,
                    description: description,
                    completed: false
                });
                document.getElementById('payment-form').reset();
                showToast("Payment added & Auto-saved!");
            } else {
                const title = document.getElementById('act-title').value.trim();
                const datetime = document.getElementById('act-datetime').value;
                const description = document.getElementById('act-desc').value.trim();
                
                remindersData.activities.push({
                    id: 'act_' + Date.now(),
                    title: title,
                    datetime: datetime,
                    description: description,
                    completed: false
                });
                document.getElementById('activity-form').reset();
                showToast("Activity added & Auto-saved!");
            }
            saveData();
        }

        function toggleStatus(type, id) {
            const list = type === 'payment' ? remindersData.payments : remindersData.activities;
            const item = list.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                saveData();
            }
        }

        function deleteItem(type, id) {
            if (type === 'payment') {
                remindersData.payments = remindersData.payments.filter(i => i.id !== id);
            } else {
                remindersData.activities = remindersData.activities.filter(i => i.id !== id);
            }
            saveData();
            showToast("Item removed.");
        }

        function formatDateTime(dtStr) {
            const dt = new Date(dtStr);
            return dt.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        }

        // Updated Badge function to show Future time left as well as Overlapsed
        function getStatusBadge(datetime) {
            const now = new Date().getTime();
            const itemTime = new Date(datetime).getTime();
            const timeDiff = now - itemTime;

            if (timeDiff >= 0) {
                // Overlapsed Logic (Past)
                const hours = Math.floor(timeDiff / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));

                if (hours >= 5) {
                    return ""; 
                } else if (hours > 0) {
                    return `<span class="badge-overlapse" style="background: rgba(255, 165, 2, 0.2); color: var(--warning); border: 1px solid var(--warning);">Overlapsed: ${hours} hour(s) ago</span>`;
                } else if (minutes > 0) {
                    return `<span class="badge-overlapse" style="background: rgba(255, 165, 2, 0.2); color: var(--warning); border: 1px solid var(--warning);">Overlapsed: ${minutes} min(s) ago</span>`;
                } else {
                    return `<span class="badge-overlapse" style="background: rgba(46, 213, 115, 0.2); color: var(--success); border: 1px solid var(--success);">Exact date is reached</span>`;
                }
            } else {
                // Time Left Logic (Future)
                const futureDiff = Math.abs(timeDiff);
                const daysLeft = Math.floor(futureDiff / (1000 * 60 * 60 * 24));
                const hoursLeft = Math.floor((futureDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minsLeft = Math.floor((futureDiff % (1000 * 60 * 60)) / (1000 * 60));

                let timeLeftStr = "";
                if (daysLeft > 0) timeLeftStr += `${daysLeft}d `;
                if (hoursLeft > 0) timeLeftStr += `${hoursLeft}h `;
                if (daysLeft === 0 && minsLeft > 0) timeLeftStr += `${minsLeft}m `;

                if (timeLeftStr.trim() === "") timeLeftStr = "< 1m ";

                return `<span class="badge-overlapse" style="background: rgba(0, 242, 254, 0.1); color: var(--accent-cyan); border: 1px solid var(--accent-cyan);">⏳ ${timeLeftStr.trim()} left</span>`;
            }
        }

        function renderReminders() {
            const payContainer = document.getElementById('payments-list');
            const actContainer = document.getElementById('activities-list');

            // Handling the Loading State
            if (isInitialLoad) {
                const loaderHtml = `
                    <div class="loading-container">
                        <div class="loader"></div>
                        <span>Syncing pending tasks...</span>
                    </div>`;
                payContainer.innerHTML = loaderHtml;
                actContainer.innerHTML = loaderHtml;
                return; // Stop rendering lists until load is complete
            }

            // Regular Render Logic
            payContainer.innerHTML = '';
            if (remindersData.payments.length === 0) {
                payContainer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">No pending payment reminders.</div>';
            } else {
                remindersData.payments.forEach(item => {
                    const badge = !item.completed ? getStatusBadge(item.datetime) : '';
                    const descHTML = item.description ? `<div class="item-desc">📝 ${escapeHtml(item.description)}</div>` : '';
                    payContainer.innerHTML += `
                        <div class="reminder-item ${item.completed ? 'completed' : ''}">
                            <div class="item-left">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleStatus('payment', '${item.id}')">
                                <div class="item-details">
                                    <span class="item-text">${escapeHtml(item.title)} ${badge}</span>
                                    <span class="item-sub">₱ ${escapeHtml(item.amount)} — Due: ${formatDateTime(item.datetime)}</span>
                                    ${descHTML}
                                </div>
                            </div>
                            <button class="btn-delete" onclick="deleteItem('payment', '${item.id}')">✕</button>
                        </div>
                    `;
                });
            }

            actContainer.innerHTML = '';
            if (remindersData.activities.length === 0) {
                actContainer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">No pending activity reminders.</div>';
            } else {
                remindersData.activities.forEach(item => {
                    const badge = !item.completed ? getStatusBadge(item.datetime) : '';
                    const descHTML = item.description ? `<div class="item-desc">📝 ${escapeHtml(item.description)}</div>` : '';
                    actContainer.innerHTML += `
                        <div class="reminder-item ${item.completed ? 'completed' : ''}">
                            <div class="item-left">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleStatus('activity', '${item.id}')">
                                <div class="item-details">
                                    <span class="item-text">${escapeHtml(item.title)} ${badge}</span>
                                    <span class="item-sub">Scheduled: ${formatDateTime(item.datetime)}</span>
                                    ${descHTML}
                                </div>
                            </div>
                            <button class="btn-delete" onclick="deleteItem('activity', '${item.id}')">✕</button>
                        </div>
                    `;
                });
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2500);
        }

        // --- EXPORT AND IMPORT FEATURES ---

        function getFormattedFileName(extension) {
    const d = new Date();
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    
    const month = months[d.getMonth()];
    const day = String(d.getDate()).padStart(2, '0');
    const year = d.getFullYear();
    
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    
    // Convert to 12-hour format
    hours = hours % 12;
    hours = hours ? hours : 12; 
    
    // Outputs: RML_Reminder Aug. 05, 2026_7:28PM.ext
    return `RML_Reminder ${month}. ${day}, ${year}_${hours}:${minutes}${ampm}.${extension}`;
}

        function exportToCSV() {
            let csvContent = "Type,ID,Title,Amount,DateTime,Description,Completed\n";
            
            remindersData.payments.forEach(item => {
                let row = ["Payment", item.id, `"${item.title.replace(/"/g, '""')}"`, item.amount, item.datetime, `"${(item.description || '').replace(/"/g, '""')}"`, item.completed];
                csvContent += row.join(",") + "\n";
            });

            remindersData.activities.forEach(item => {
                let row = ["Activity", item.id, `"${item.title.replace(/"/g, '""')}"`, "", item.datetime, `"${(item.description || '').replace(/"/g, '""')}"`, item.completed];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", getFormattedFileName("csv"));
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("CSV Exported successfully!");
        }

        function importFromCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split("\n");
                let importedCount = 0;

                for (let i = 1; i < lines.length; i++) { 
                    const line = lines[i].trim();
                    if (!line) continue;

                    const row = [];
                    let inQuotes = false;
                    let current = "";
                    for (let c = 0; c < line.length; c++) {
                        const char = line[c];
                        if (char === '"' && line[c+1] === '"') {
                            current += '"';
                            c++;
                        } else if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            row.push(current);
                            current = "";
                        } else {
                            current += char;
                        }
                    }
                    row.push(current);

                    if (row.length >= 7) {
                        const type = row[0];
                        const id = row[1];
                        const title = row[2];
                        const amount = row[3];
                        const datetime = row[4];
                        const description = row[5];
                        const completed = row[6] === 'true';

                        if (type === "Payment") {
                            if (!remindersData.payments.find(p => p.id === id)) {
                                remindersData.payments.push({id, title, amount, datetime, description, completed});
                                importedCount++;
                            }
                        } else if (type === "Activity") {
                            if (!remindersData.activities.find(a => a.id === id)) {
                                remindersData.activities.push({id, title, datetime, description, completed});
                                importedCount++;
                            }
                        }
                    }
                }
                
                if (importedCount > 0) {
                    saveData();
                    showToast(`${importedCount} items imported!`);
                } else {
                    showToast("No new items found to import.");
                }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        // --- PDF AND JPG GENERATION ---

        function getPdfStatusStr(item) {
            if (item.completed) return '<span style="color: green;">DONE</span>';
            
            const now = new Date().getTime();
            const itemTime = new Date(item.datetime).getTime();
            const timeDiff = now - itemTime;

            if (timeDiff >= 0) {
                const hours = Math.floor(timeDiff / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                if (hours >= 5) return '';
                if (hours > 0) return `<span style="color: red;">OVERLAPSED: ${hours} HR(S) AGO</span>`;
                if (minutes > 0) return `<span style="color: red;">OVERLAPSED: ${minutes} MIN(S) AGO</span>`;
                return `<span style="color: green;">EXACT DATE REACHED</span>`;
            } else {
                const futureDiff = Math.abs(timeDiff);
                const daysLeft = Math.floor(futureDiff / (1000 * 60 * 60 * 24));
                const hoursLeft = Math.floor((futureDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                if(daysLeft > 0) return `<span style="color: blue;">DUE IN ${daysLeft} DAY(S)</span>`;
                if(hoursLeft > 0) return `<span style="color: blue;">DUE IN ${hoursLeft} HR(S)</span>`;
                return `<span style="color: blue;">DUE IN < 1 HR</span>`;
            }
        }

        function prepareTemplateData() {
            const now = new Date();
            document.getElementById('pdf-timestamp').innerText = `Report generated on: ${now.toLocaleDateString()} at ${now.toLocaleTimeString()}`;

            const pdfPayList = document.getElementById('pdf-payments-list');
            if (remindersData.payments.length === 0) {
                pdfPayList.innerHTML = '<i>No payment items recorded.</i>';
            } else {
                pdfPayList.innerHTML = remindersData.payments.map(p => `
                    <div style="margin-bottom: 10px; border-bottom: 1px dotted #ccc; padding-bottom: 6px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <b>[ ${p.completed ? 'X' : ' '} ] ${escapeHtml(p.title)}</b> — <span style="color: #555;">₱ ${escapeHtml(p.amount)} (Due: ${formatDateTime(p.datetime)})</span>
                            </div>
                            <span style="font-size: 12px; font-weight: bold;">${getPdfStatusStr(p)}</span>
                        </div>
                        ${p.description ? `<div style="font-size: 12px; color: #666; margin-top: 3px; font-style: italic;">Note: ${escapeHtml(p.description)}</div>` : ''}
                    </div>
                `).join('');
            }

            const pdfActList = document.getElementById('pdf-activities-list');
            if (remindersData.activities.length === 0) {
                pdfActList.innerHTML = '<i>No activity items recorded.</i>';
            } else {
                pdfActList.innerHTML = remindersData.activities.map(a => `
                    <div style="margin-bottom: 10px; border-bottom: 1px dotted #ccc; padding-bottom: 6px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <b>[ ${a.completed ? 'X' : ' '} ] ${escapeHtml(a.title)}</b> — <span style="color: #555;">${formatDateTime(a.datetime)}</span>
                            </div>
                            <span style="font-size: 12px; font-weight: bold;">${getPdfStatusStr(a)}</span>
                        </div>
                        ${a.description ? `<div style="font-size: 12px; color: #666; margin-top: 3px; font-style: italic;">Note: ${escapeHtml(a.description)}</div>` : ''}
                    </div>
                `).join('');
            }
        }

        function generateReceipt(type) {
            prepareTemplateData();
            showToast(`Generating ${type.toUpperCase()} Document... ⏳`);
            const container = document.getElementById('pdf-template-container');
            
            setTimeout(() => {
                html2canvas(container, { 
                    scale: 2, 
                    useCORS: true, 
                    backgroundColor: '#ffffff' 
                }).then(canvas => {
                    const imgData = canvas.toDataURL(type === 'jpg' ? 'image/jpeg' : 'image/png', 1.0);
                    const filename = getFormattedFileName(type);
                    
                    if (type === 'jpg') {
                        let link = document.createElement('a');
                        link.download = filename;
                        link.href = imgData;
                        link.click();
                        showToast("JPG Document Saved! 🖼️");
                    } else if (type === 'pdf') {
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF('p', 'mm', 'a4');
                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                        
                        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                        pdf.save(filename);
                        showToast("PDF Document Saved! 📄");
                    }
                }).catch(err => {
                    console.error("Export error:", err);
                    showToast("Error generating file. Check console.");
                });
            }, 500);
        }
        
        // Initial manual trigger for the loader right away. 
        renderReminders();
    </script>
