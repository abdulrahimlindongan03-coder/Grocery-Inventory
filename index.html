<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RML Inventory</title>
    
    <!-- Web App Manifest for Android -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="app-icon.png">
    
    <!-- Apple Touch Icon for iOS (iPhone/iPad) -->
    <link rel="apple-touch-icon" sizes="180x180" href="app-icon.png">
    
    <!-- Theme Color for Android Chrome -->
    <meta name="theme-color" content="#4f46e5">

    <!-- html2canvas library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- html5-qrcode library for camera barcode scanning -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --text-main: #2f3542;
            --text-muted: #57606f;
            --radius-md: 16px;
            --radius-lg: 24px;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-card: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 25px 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: -webkit-linear-gradient(45deg, #4f46e5, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p { color: var(--text-muted); font-size: 1rem; font-weight: 500; }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 12px 20px; font-size: 0.95rem; font-weight: 600;
            border-radius: 12px; border: none; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(4px);
            gap: 6px;
        }

        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4); }
        
        .btn-warning { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #2f3542; box-shadow: 0 4px 15px rgba(253, 160, 133, 0.3); }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(253, 160, 133, 0.4); }

        .btn-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3); }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4); }

        .btn-danger { background: linear-gradient(135deg, #ff9a44 0%, #fc6076 100%); color: white; box-shadow: 0 4px 15px rgba(252, 96, 118, 0.3); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(252, 96, 118, 0.4); }

        .btn-delete {
            background: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.2);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-delete:hover {
            background: #ff4757;
            color: white;
        }

        /* Category Accordion */
        .category-section {
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .category-header {
            padding: 20px 30px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.4);
            transition: background 0.3s ease;
        }

        .category-header:hover { background: rgba(255, 255, 255, 0.7); }

        .category-title {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #2d3436;
        }

        .badge {
            background: var(--primary);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .category-icon { font-size: 1.2rem; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        .category-content {
            display: none;
            padding: 25px;
            border-top: 1px solid var(--glass-border);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--glass-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
        }

        .card-img-wrapper {
            position: relative;
            height: 150px;
            background: #f1f2f6;
            padding: 10px;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .card-content {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #2f3542;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .barcode-badge {
            font-size: 0.75rem;
            background: #e0e7ff;
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: monospace;
            margin-bottom: 8px;
            display: inline-block;
            width: fit-content;
        }

        .card-exp {
            font-size: 0.85rem;
            color: #ff4757;
            font-weight: 500;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f2f6;
            padding: 8px 12px;
            border-radius: 12px;
            margin-top: auto;
        }

        .btn-qty {
            background: #ffffff;
            border: none;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            color: #2f3542;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-qty:hover { background: var(--primary); color: white; }
        .qty-display { font-size: 1.1rem; font-weight: 700; min-width: 30px; text-align: center; color: #2f3542;}

        .action-bar { display: flex; gap: 15px; justify-content: center; margin-top: 40px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: rgba(255, 255, 255, 0.95); width: 100%; max-width: 480px;
            padding: 35px; border-radius: var(--radius-lg); box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: translateY(30px); transition: transform 0.3s ease;
            max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.8);
        }

        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-header h2 { font-weight: 700; color: #2f3542; }
        .close-btn { background: #f1f2f6; border: none; font-size: 1.5rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .close-btn:hover { background: #dfe4ea; color: #ff4757;}

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; color: #2f3542;}
        .form-group input[type="text"], .form-group input[type="date"], .form-group input[type="number"], .form-group select {
            width: 100%; padding: 12px 16px; border: 2px solid #dfe4ea; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.3s; background: #ffffff;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .input-with-btn {
            display: flex;
            gap: 10px;
        }

        .file-upload-wrapper {
            border: 2px dashed #a4b0be; padding: 25px 15px; text-align: center;
            border-radius: 12px; background: #f1f2f6; cursor: pointer;
            transition: 0.3s; font-weight: 500; color: #57606f;
        }
        .file-upload-wrapper:hover { border-color: var(--primary); background: #e0e7ff; color: var(--primary); }
        
        #img-preview {
            max-width: 100%; height: 140px; object-fit: contain;
            display: none; margin: 15px auto 0; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #scanner-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            margin-bottom: 15px;
        }

        .modal-actions { margin-top: 30px; display: flex; justify-content: flex-end; gap: 12px; }

        @media (max-width: 768px) {
            header { flex-direction: column; text-align: center; gap: 20px; padding: 20px; }
            .header-actions { width: 100%; flex-direction: column; }
            .header-actions .btn { width: 100%; }
            .grid { grid-template-columns: 1fr; gap: 16px; }
            .card { flex-direction: row; height: auto; }
            .card-img-wrapper { width: 110px; height: 100%; flex-shrink: 0; padding: 10px; }
            .card-content { padding: 15px; justify-content: space-between; }
            .action-bar {
                position: fixed; bottom: 0; left: 0; right: 0;
                background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
                padding: 15px 20px; z-index: 100; margin-top: 0; border-top: 1px solid var(--glass-border);
            }
            .action-bar .btn { flex: 1; font-size: 0.85rem; padding: 12px 8px; }
        }

        #receipt-canvas { position: fixed; top: -9999px; left: -9999px; width: 420px; background: #ffffff; padding: 40px; color: #000;}
        
        #toast {
            visibility: hidden; min-width: 280px; background: rgba(47, 53, 66, 0.95); backdrop-filter: blur(5px); color: #fff;
            text-align: center; border-radius: 50px; padding: 16px 24px; position: fixed; z-index: 2000;
            left: 50%; top: 20px; transform: translateX(-50%) translateY(-20px); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-weight: 500; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); top: 30px; }

        /* Login Screen */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.3); backdrop-filter: blur(15px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            padding: 40px; text-align: center; width: 90%; max-width: 400px;
        }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="glass login-box">
            <h2>✨ Smart Inventory</h2>
            <p style="margin: 15px 0; color: var(--text-muted);">Register your nickname to continue</p>
            <input type="text" id="nickname-input" placeholder="Enter your nickname" style="padding: 12px 16px; border-radius: 12px; border: 2px solid #dfe4ea; width: 100%; margin-bottom: 20px; font-size: 1rem; outline: none;">
            <button class="btn btn-primary" style="width: 100%;" onclick="registerNickname()">Start Managing</button>
        </div>
    </div>

    <div class="container">
        <header class="glass">
            <div>
                <h1>✨ Smart Inventory</h1>
                <p id="welcome-msg">Track stocks, dates, and restocks beautifully.</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-warning" onclick="startScanner('consume')">📷 Consume (Scan)</button>
                <button class="btn btn-primary" onclick="openModal()">+ Add New Product</button>
            </div>
        </header>

        <main id="app-content">
            <!-- Dynamically Injected Content -->
        </main>

        <div class="action-bar">
            <button class="btn btn-success" onclick="saveData()">💾 Save Data</button>
            <button class="btn btn-danger" onclick="generateReceipt()">🧾 Download Visual Receipt</button>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Product</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Barcode / Code</label>
                    <div class="input-with-btn">
                        <input type="text" id="new-barcode" placeholder="Scan or type barcode">
                        <button class="btn btn-warning" style="padding:0 15px;" onclick="startScanner('addModal')">📷 Scan</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="new-name" placeholder="e.g. Organic Almond Milk">
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <select id="new-category" onchange="handleCategoryChange()"></select>
                    <input type="text" id="new-category-name" placeholder="Type new category name..." style="display:none; margin-top:10px; border-color: var(--primary);">
                </div>

                <div class="form-group">
                    <label>Expiration Date</label>
                    <input type="date" id="new-exp">
                </div>
                <div class="form-group">
                    <label>Product Image</label>
                    <div class="file-upload-wrapper" onclick="document.getElementById('new-file').click()">
                        📸 Tap to Upload Image
                    </div>
                    <input type="file" id="new-file" accept="image/*" style="display:none;" onchange="previewImage(event)">
                    <img id="img-preview" src="" alt="Preview">
                </div>
                <div class="form-group">
                    <label>Initial Quantity</label>
                    <input type="number" id="new-qty" value="1" min="0">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" style="background:#f1f2f6; color:#2f3542;" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addNewProduct()">Save Product</button>
            </div>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div class="modal-overlay" id="scannerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="scanner-title">Scan Barcode</h2>
                <button class="close-btn" onclick="closeScanner()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="scanner-container">
                    <div id="interactive-reader" style="width:100%;"></div>
                </div>
                <p style="text-align:center; color: var(--text-muted); font-size: 0.9rem;">Position barcode inside camera frame</p>
            </div>
        </div>
    </div>

    <div id="toast">Data Saved Successfully!</div>
    <div id="receipt-canvas"></div>

    <script>
        // Login System Initialization
        function checkLogin() {
            const nickname = localStorage.getItem('premiumInventoryNickname');
            if (nickname) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('welcome-msg').innerText = `Welcome, ${nickname}! Track stocks, dates, and restocks beautifully.`;
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }
        }

        function registerNickname() {
            const nickname = document.getElementById('nickname-input').value.trim();
            if (nickname) {
                localStorage.setItem('premiumInventoryNickname', nickname);
                checkLogin();
                showToast(`Welcome, ${nickname}! 🎉`);
            } else {
                alert("Please enter a nickname.");
            }
        }

        // Helper to generate SVG data-uri for fallbacks
        function generateDefaultImage(text) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" style="background:%23f1f2f6"><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="%23a4b0be">${text.charAt(0).toUpperCase()}</text></svg>`;
            return "data:image/svg+xml;base64," + btoa(svg);
        }

        // Initialize with Empty Array to meet criteria
        const defaultData = [];

        let inventoryData = JSON.parse(localStorage.getItem('premiumInventoryData')) || defaultData;
        let base64ImageString = ""; 
        let html5QrcodeScanner = null;
        let currentScannerMode = ""; 

        // Render Application
        function renderApp() {
            const container = document.getElementById('app-content');
            container.innerHTML = '';

            if (inventoryData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">No categories or products yet. Click "+ Add New Product" to get started!</div>';
            }

            inventoryData.forEach((categoryGroup, index) => {
                const section = document.createElement('div');
                section.className = 'category-section glass';
                
                const headerHTML = `
                    <div class="category-header" onclick="toggleCategory(${index})">
                        <div class="category-title">
                            <span>📁 ${categoryGroup.category}</span>
                            <span class="badge">${categoryGroup.items.length}</span>
                            <button class="btn-delete" style="margin-left: 15px;" onclick="event.stopPropagation(); deleteCategory(${index})">Delete Category 🗑️</button>
                        </div>
                        <div class="category-icon" id="icon-${index}">▼</div>
                    </div>
                `;

                let gridHTML = `<div class="category-content" id="content-${index}"><div class="grid">`;
                
                if (categoryGroup.items.length === 0) {
                    gridHTML += '<p style="color:var(--text-muted); font-style:italic;">No items in this category.</p>';
                }

                categoryGroup.items.forEach(item => {
                    gridHTML += `
                        <div class="card">
                            <div class="card-img-wrapper">
                                <img src="${item.img}" alt="${item.name}" loading="lazy">
                            </div>
                            <div class="card-content">
                                <div class="card-header-row">
                                    <h3 class="card-title" title="${item.name}">${item.name}</h3>
                                    <button class="btn-delete" title="Delete product" onclick="deleteProduct('${item.id}')">🗑️</button>
                                </div>
                                ${item.barcode ? `<span class="barcode-badge">🏷️ ${item.barcode}</span>` : ''}
                                <div class="card-exp">⏱ Exp: ${item.exp || 'N/A'}</div>
                                <div class="controls">
                                    <button class="btn-qty" onclick="updateQty('${item.id}', -1)">-</button>
                                    <span class="qty-display" id="qty-${item.id}">${item.qty}</span>
                                    <button class="btn-qty" onclick="updateQty('${item.id}', 1)">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                gridHTML += `</div></div>`;
                section.innerHTML = headerHTML + gridHTML;
                container.appendChild(section);
            });

            populateCategorySelect();
        }

        // Delete Category Function
        function deleteCategory(index) {
            if (confirm(`Are you sure you want to completely delete the "${inventoryData[index].category}" category and all its products?`)) {
                inventoryData.splice(index, 1);
                saveData(false);
                renderApp();
                showToast("Category deleted 🗑️");
            }
        }

        // Accordion Toggle
        function toggleCategory(index) {
            const content = document.getElementById(`content-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            
            if (content.style.display === "block") {
                content.style.display = "none";
                content.style.animation = "";
                icon.style.transform = "rotate(0deg)";
            } else {
                content.style.display = "block";
                content.style.animation = "slideDown 0.3s ease-out forwards";
                icon.style.transform = "rotate(180deg)";
            }
        }

        // Update Stock Quantity
        function updateQty(itemId, change) {
            for (let group of inventoryData) {
                let item = group.items.find(i => i.id === itemId);
                if (item) {
                    let newQty = item.qty + change;
                    if (newQty < 0) newQty = 0;
                    item.qty = newQty;
                    document.getElementById(`qty-${itemId}`).innerText = newQty;
                    break;
                }
            }
        }

        // Delete Product Feature
        function deleteProduct(itemId) {
            if (!confirm("Are you sure you want to delete this product?")) return;

            for (let group of inventoryData) {
                const itemIndex = group.items.findIndex(i => i.id === itemId);
                if (itemIndex !== -1) {
                    group.items.splice(itemIndex, 1);
                    saveData(false);
                    renderApp();
                    showToast("Product deleted 🗑️");
                    break;
                }
            }
        }

        // CAMERA BARCODE SCANNER LOGIC
        function startScanner(mode) {
            currentScannerMode = mode;
            document.getElementById('scannerModal').classList.add('active');
            document.getElementById('scanner-title').innerText = mode === 'consume' ? 'Scan Product to Consume' : 'Scan Product Barcode';

            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("interactive-reader");
            }

            const config = { fps: 10, qrbox: { width: 250, height: 150 } };
            
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess
            ).catch(err => {
                alert("Camera access failed or permission denied: " + err);
                closeScanner();
            });
        }

        function onScanSuccess(decodedText) {
            closeScanner();

            if (currentScannerMode === 'addModal') {
                document.getElementById('new-barcode').value = decodedText;
                showToast(`Barcode Scanned: ${decodedText} 🏷️`);
            } 
            else if (currentScannerMode === 'consume') {
                handleConsumeBarcode(decodedText);
            }
        }

        function closeScanner() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('scannerModal').classList.remove('active');
                }).catch(() => {
                    document.getElementById('scannerModal').classList.remove('active');
                });
            } else {
                document.getElementById('scannerModal').classList.remove('active');
            }
        }

        function handleConsumeBarcode(barcode) {
            let foundItem = null;

            for (let group of inventoryData) {
                let item = group.items.find(i => i.barcode === barcode);
                if (item) {
                    foundItem = item;
                    break;
                }
            }

            if (!foundItem) {
                alert(`No product found matching barcode: ${barcode}`);
                return;
            }

            const inputConsume = prompt(`Found Product: "${foundItem.name}"\nCurrent Stock: ${foundItem.qty}\n\nHow many would you like to CONSUME?`, "1");
            
            if (inputConsume === null) return; 
            
            const consumeAmount = parseInt(inputConsume);
            if (isNaN(consumeAmount) || consumeAmount <= 0) {
                alert("Invalid quantity entered.");
                return;
            }

            if (consumeAmount > foundItem.qty) {
                alert(`Warning: You cannot consume more than current stock (${foundItem.qty}).`);
                return;
            }

            foundItem.qty -= consumeAmount;
            saveData(false);
            renderApp();
            showToast(`Consumed ${consumeAmount} x ${foundItem.name}! 📉`);
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400, MAX_HEIGHT = 400;
                    let width = img.width, height = img.height;

                    if (width > height && width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } 
                    else if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }

                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    base64ImageString = canvas.toDataURL('image/jpeg', 0.8);
                    
                    const preview = document.getElementById('img-preview');
                    preview.src = base64ImageString;
                    preview.style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function openModal() { document.getElementById('productModal').classList.add('active'); }
        function closeModal() { document.getElementById('productModal').classList.remove('active'); clearForm(); }
        
        function populateCategorySelect() {
            const select = document.getElementById('new-category');
            select.innerHTML = '';
            
            inventoryData.forEach(group => { 
                select.innerHTML += `<option value="${group.category}">${group.category}</option>`; 
            });
            
            select.innerHTML += `<option value="add_new_category" style="font-weight:bold; color:var(--primary);">➕ Add New Category...</option>`;
            
            // Auto-select add new category if there are no existing categories
            if(inventoryData.length === 0) {
                select.value = 'add_new_category';
            }
            handleCategoryChange(); 
        }
        
        function handleCategoryChange() {
            const select = document.getElementById('new-category');
            const newCatInput = document.getElementById('new-category-name');
            
            if (select.value === 'add_new_category') {
                newCatInput.style.display = 'block';
                newCatInput.focus();
            } else {
                newCatInput.style.display = 'none';
                newCatInput.value = '';
            }
        }

        function clearForm() {
            document.getElementById('new-barcode').value = '';
            document.getElementById('new-name').value = '';
            document.getElementById('new-exp').value = '';
            document.getElementById('new-file').value = '';
            document.getElementById('new-qty').value = '1';
            document.getElementById('img-preview').style.display = 'none';
            base64ImageString = "";
            
            const select = document.getElementById('new-category');
            if (select.options.length > 0) select.selectedIndex = 0;
            if (inventoryData.length === 0) select.value = 'add_new_category';
            handleCategoryChange();
        }

        function addNewProduct() {
            const barcode = document.getElementById('new-barcode').value.trim();
            const name = document.getElementById('new-name').value.trim();
            let category = document.getElementById('new-category').value;
            const newCatName = document.getElementById('new-category-name').value.trim();
            const exp = document.getElementById('new-exp').value;
            const qty = parseInt(document.getElementById('new-qty').value);

            if (!name) return alert("Product name is required!");

            if (category === 'add_new_category') {
                if (!newCatName) return alert("Please enter a name for your new category!");
                category = newCatName; 
            }

            let finalImage = base64ImageString || generateDefaultImage(name);
            const newItem = { 
                id: 'item_' + Date.now(), 
                barcode: barcode,
                name: name, 
                qty: isNaN(qty) ? 1 : qty, 
                exp: exp, 
                img: finalImage 
            };

            let categoryGroup = inventoryData.find(g => g.category.toLowerCase() === category.toLowerCase());
            
            if (categoryGroup) { 
                categoryGroup.items.push(newItem); 
            } else {
                inventoryData.push({
                    category: category,
                    items: [newItem]
                });
            }

            saveData(false);
            renderApp();
            
            const catIndex = inventoryData.findIndex(g => g.category.toLowerCase() === category.toLowerCase());
            if(catIndex !== -1) {
                document.getElementById(`content-${catIndex}`).style.display = "block";
                document.getElementById(`icon-${catIndex}`).style.transform = "rotate(180deg)";
            }
            
            closeModal();
            showToast("Product Added Successfully! 🎉");
        }

        function saveData(notify = true) {
            localStorage.setItem('premiumInventoryData', JSON.stringify(inventoryData));
            if(notify) showToast("Inventory Saved! 💾");
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        function generateReceipt() {
            const receiptDiv = document.getElementById('receipt-canvas');
            const now = new Date();
            
            let receiptHTML = `
                <div style="text-align:center; border-bottom:3px dashed #2d3436; padding-bottom:20px; margin-bottom:20px;">
                    <h2 style="margin:0; font-size:28px; font-weight:800; color:#2d3436;">STOCK REPORT</h2>
                    <p style="margin:8px 0 0 0; color:#636e72; font-size:16px;">${now.toLocaleDateString()} at ${now.toLocaleTimeString()}</p>
                </div>
            `;

            inventoryData.forEach(group => {
                if (group.items.length === 0) return; 
                receiptHTML += `<div style="margin-top:25px; font-weight:700; border-bottom:2px solid #dfe6e9; font-size:20px; padding-bottom:8px; color:#000;">${group.category}</div>`;
                
                group.items.forEach(item => {
                    receiptHTML += `
                        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:12px; font-size:18px; font-weight:500; color:#2d3436;">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <img src="${item.img}" style="width:45px; height:45px; object-fit:cover; border-radius:8px; border:1px solid #dfe6e9;" crossorigin="anonymous">
                                <div>
                                    <span>${item.name}</span>
                                    ${item.barcode ? `<div style="font-size:12px; color:#636e72;">#${item.barcode}</div>` : ''}
                                </div>
                            </div>
                            <span style="font-weight:700; background:#f1f2f6; padding:4px 12px; border-radius:8px;">x${item.qty}</span>
                        </div>
                    `;
                });
            });

            receiptHTML += `<div style="margin-top:35px; border-top:3px dashed #2d3436; padding-top:20px; text-align:center; font-size:16px; font-weight:600; color:#636e72;">-- End of Inventory Report --</div>`;
            
            receiptDiv.innerHTML = receiptHTML;
            showToast("Generating Receipt Image... ⏳");

            setTimeout(() => {
                html2canvas(receiptDiv, { backgroundColor: '#ffffff', scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Visual_Stock_Report_${now.getTime()}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    receiptDiv.innerHTML = '';
                    showToast("Receipt Downloaded! 🧾");
                });
            }, 500);
        }

        // Check login on script load, then render app
        checkLogin();
        renderApp();
    </script>
</body>
</html>
