<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RML Partner Hub</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="app-icon.ico">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* === COLOR SYSTEM & DESIGN TOKENS === */
        :root {
            --bg-dark: #0a0c14;
            --card-bg: rgba(18, 22, 36, 0.65);
            --border-glow: rgba(0, 242, 254, 0.25);
            --accent-cyan: #00f2fe;
            --accent-violet: #4facfe;
            --accent-purple: #7f00ff;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Modern Animated Mesh Gradient Background */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 50vw;
            height: 50vw;
            min-width: 500px;
            min-height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            animation: pulseGlow 10s infinite alternate;
        }

        body::before {
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            top: -10%;
            left: -10%;
        }

        body::after {
            background: radial-gradient(circle, var(--accent-cyan), transparent 70%);
            bottom: -10%;
            right: -10%;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(50px, 30px); opacity: 0.9; }
        }

        .serif {
            font-family: 'Times New Roman', Times, serif;
        }

        /* === MODERN GLASS CARD CONTAINER === */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(0, 242, 254, 0.1);
            position: relative;
            z-index: 10;
        }

        /* === AUTH / LOGIN SECTION === */
        #auth-section {
            display: none; /* Controlled by JS */
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-header {
            margin-bottom: 28px;
        }

        .auth-title {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input[type="email"],
        .input-group input[type="text"],
        .input-group input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Password container wrapper for toggle button */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 45px !important;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--accent-cyan);
        }

        /* Remember Me Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            text-align: left;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .checkbox-group input[type="checkbox"]:checked {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .checkbox-group input[type="checkbox"]:checked::after {
            content: '✔';
            position: absolute;
            color: #000;
            font-size: 14px;
            font-weight: 800;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .checkbox-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple));
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(127, 0, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(127, 0, 255, 0.5);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }

        /* === MAIN DASHBOARD SECTION === */
        #dashboard-section {
            display: none; /* Controlled by JS */
            width: 90%;
            max-width: 1100px;
            min-height: 580px;
            padding: 40px;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* === DESKTOP STYLE (Default) === */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            align-items: center;
            height: 100%;
            gap: 40px;
        }

        .robot-container {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatRobot 5s ease-in-out infinite;
        }

        .robot-container img {
            width: 100%;
            max-width: 300px;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(0, 242, 254, 0.3));
        }

        .dashboard-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-wrapper {
            margin-bottom: 15px;
        }

        .logo-center {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 20px;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .welcome-msg {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .user-highlight {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .subtitle-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 35px;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 450px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .nav-btn {
            flex: 1;
            padding: 18px 24px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glow);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(127, 0, 255, 0.2));
            border-color: var(--accent-cyan);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.25);
        }

        .signout-btn {
            background: transparent;
            border: 1px solid rgba(255, 77, 77, 0.4);
            color: #ff4d4d;
            padding: 10px 28px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .signout-btn:hover {
            background: #ff4d4d;
            color: #fff;
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
        }

        /* ANIMATIONS */
        @keyframes floatRobot {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* === MOBILE STYLE === */
        @media (max-width: 900px) {
            body {
                align-items: flex-start;
                padding: 20px 0;
            }

            /* Auth Section Mobile */
            #auth-section {
                width: 90%;
                padding: 30px 20px;
                margin: auto;
            }

            .auth-title { font-size: 1.8rem; }

            /* Dashboard Section Mobile */
            #dashboard-section {
                width: 95%;
                padding: 30px 15px;
                min-height: auto;
                margin: auto;
            }

            /* Reverse the grid so Content is on top, robot is on bottom */
            .dashboard-grid {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .brand-title {
                font-size: 2.2rem;
            }
            
            .welcome-msg {
                font-size: 1.2rem;
            }

            .logo-center {
                width: 70px;
                height: 70px;
            }

            .subtitle-text {
                font-size: 0.85rem;
                margin-bottom: 25px;
                padding: 0 10px;
            }

            /* Stack buttons vertically on mobile for thumb accessibility */
            .action-buttons {
                flex-direction: column;
                width: 100%;
                gap: 15px;
                margin-bottom: 30px;
            }

            .nav-btn {
                width: 100%;
                padding: 16px;
                font-size: 1rem;
            }

            /* Adjust robot size and put it at the bottom */
            .robot-container {
                order: 2; /* Forces robot below the content */
                margin-top: 10px;
            }

            .robot-container img {
                max-width: 160px;
            }

            .dashboard-center {
                order: 1; /* Forces content above robot */
            }
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION CARD -->
    <div id="auth-section" class="glass-card">
        <div class="auth-header">
            <h2 class="auth-title serif">RML Partner</h2>
            <p class="auth-subtitle">Sign in or create your account to proceed</p>
        </div>
        <form id="auth-form">
            <div class="input-group">
                <label for="gmail">Gmail Address</label>
                <input type="email" id="gmail" placeholder="name@gmail.com" required>
            </div>
            <div class="input-group">
                <label for="nickname">Unique Nickname</label>
                <input type="text" id="nickname" placeholder="Choose nickname" required>
            </div>
            <div class="input-group">
                <label for="password">Password (8+ characters)</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" id="toggle-password-btn" class="toggle-password" onclick="togglePasswordVisibility()" title="Show/Hide Password">👁️</button>
                </div>
            </div>
            
            <div class="checkbox-group" onclick="toggleCheckbox(event)">
                <input type="checkbox" id="remember-me" checked>
                <label for="remember-me">Remember my details for easy sign-in</label>
            </div>

            <div id="error-msg" class="error-msg"></div>
            <button type="submit" class="btn-primary">Access Dashboard</button>
        </form>
    </div>

    <!-- MAIN DASHBOARD CARD -->
    <div id="dashboard-section" class="glass-card">
        <div class="dashboard-grid">
            
            <!-- LEFT SIDE (Desktop) / BOTTOM (Mobile): ROBOT IMAGE -->
            <div class="robot-container">
                <img src="robot.png" alt="Robot Partner">
            </div>

            <!-- RIGHT SIDE (Desktop) / TOP (Mobile): CONTENT & ACTIONS -->
            <div class="dashboard-center">
                <div class="logo-wrapper">
                    <img src="logo.png" alt="RML Logo" class="logo-center" onerror="this.src='https://via.placeholder.com/90/00f2fe/ffffff?text=LOGO'">
                </div>
                
                <h1 class="brand-title serif">RML Partner</h1>
                <h2 class="welcome-msg serif">Welcome, <span id="display-nickname" class="user-highlight"></span>!</h2>
                <p class="subtitle-text">Select a service category below to manage your operations.</p>

                <div class="action-buttons">
                    <button class="nav-btn" onclick="window.location.href='grocery.html'">
                        <span>🛒</span> Grocery Stock
                    </button>
                    <button class="nav-btn" onclick="window.location.href='reminder.html'">
                        <span>⏰</span> Reminder
                    </button>
                </div>

                <button class="signout-btn" onclick="signOut()">Sign Out</button>
            </div>

        </div>
    </div>

    <script>
        // Database & Storage Initialization
        let usersDB = {};
        try {
            usersDB = JSON.parse(localStorage.getItem('app_users')) || {};
        } catch (e) {
            usersDB = {};
        }
        
        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const authForm = document.getElementById('auth-form');
        const errorMsg = document.getElementById('error-msg');
        const displayNickname = document.getElementById('display-nickname');
        
        const emailInput = document.getElementById('gmail');
        const nicknameInput = document.getElementById('nickname');
        const passwordInput = document.getElementById('password');
        const rememberMeCheck = document.getElementById('remember-me');

        // Allow clicking the label div to toggle checkbox
        function toggleCheckbox(e) {
            if(e.target.tagName !== 'INPUT') {
                rememberMeCheck.checked = !rememberMeCheck.checked;
            }
        }

        // Toggle password visibility function
        function togglePasswordVisibility() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                document.getElementById('toggle-password-btn').textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                document.getElementById('toggle-password-btn').textContent = '👁️';
            }
        }

        // --- SESSION MANAGEMENT ON LOAD ---
        function initializeApp() {
            const activeSession = localStorage.getItem('active_user');
            
            if (activeSession && usersDB[activeSession]) {
                showDashboardView(usersDB[activeSession].nickname);
            } else {
                showLoginView();
                const rememberedEmail = localStorage.getItem('remembered_email');
                const rememberedNickname = localStorage.getItem('remembered_nickname');
                
                if (rememberedEmail && rememberedNickname) {
                    emailInput.value = rememberedEmail;
                    nicknameInput.value = rememberedNickname;
                    rememberMeCheck.checked = true;
                }
            }
        }

        // Handle Signup / Login Submission
        authForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim().toLowerCase();
            const nickname = nicknameInput.value.trim();
            const password = passwordInput.value;

            errorMsg.style.display = 'none';

            // Validate password length requirement (at least 8 characters)
            if (password.length < 8) {
                showError("Password must be at least 8 characters long.");
                return;
            }

            // Check if user exists
            if (usersDB[email]) {
                const user = usersDB[email];
                if (user.password === password && user.nickname.toLowerCase() === nickname.toLowerCase()) {
                    processLogin(email, user.nickname);
                } else {
                    showError("Invalid credentials or nickname mismatch for this Gmail.");
                }
            } else {
                // New User Signup: Ensure Nickname is completely unique
                let isNicknameTaken = false;
                for (let existingEmail in usersDB) {
                    if (usersDB[existingEmail].nickname.toLowerCase() === nickname.toLowerCase()) {
                        isNicknameTaken = true;
                        break;
                    }
                }

                if (isNicknameTaken) {
                    showError("Nickname already taken. Please choose another.");
                } else {
                    // Register and save user record
                    usersDB[email] = {
                        nickname: nickname,
                        password: password,
                        savedData: {}
                    };
                    localStorage.setItem('app_users', JSON.stringify(usersDB));
                    processLogin(email, nickname);
                }
            }
        });

        function processLogin(email, nickname) {
            if (rememberMeCheck.checked) {
                localStorage.setItem('remembered_email', email);
                localStorage.setItem('remembered_nickname', nickname);
            } else {
                localStorage.removeItem('remembered_email');
                localStorage.removeItem('remembered_nickname');
            }

            localStorage.setItem('active_user', email);
            showDashboardView(nickname);
        }

        function signOut() {
            localStorage.removeItem('active_user');
            passwordInput.value = ''; 
            passwordInput.type = 'password';
            document.getElementById('toggle-password-btn').textContent = '👁️';
            
            if (!localStorage.getItem('remembered_email')) {
                emailInput.value = '';
                nicknameInput.value = '';
            }
            
            showLoginView();
        }

        function showDashboardView(nickname) {
            authSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            displayNickname.textContent = nickname;
        }

        function showLoginView() {
            dashboardSection.style.display = 'none';
            authSection.style.display = 'block';
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        // Start the app logic when the page loads
        initializeApp();
    </script>

   <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            // Added ./ to ensure correct pathing on GitHub Pages
            navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    console.log('Service Worker registered successfully');
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        });
    }
</script>
</body>
</html>
