<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RML Partner Hub</title>
    <link rel="manifest" href="manifest.json">
    
    <link rel="icon" type="image/png" href="app-icon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* === COLOR SYSTEM & DESIGN TOKENS === */
        :root {
            --bg-dark: #0a0c14;
            --card-bg: rgba(18, 22, 36, 0.65);
            --border-glow: rgba(0, 242, 254, 0.25);
            --accent-cyan: #00f2fe;
            --accent-violet: #4facfe;
            --accent-purple: #7f00ff;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
        }

        /* FORCING POPPINS BOLD EVERYWHERE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif !important;
            font-weight: 700 !important; 
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Modern Animated Mesh Gradient Background */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 50vw;
            height: 50vw;
            min-width: 500px;
            min-height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            animation: pulseGlow 10s infinite alternate;
        }

        body::before {
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            top: -10%;
            left: -10%;
        }

        body::after {
            background: radial-gradient(circle, var(--accent-cyan), transparent 70%);
            bottom: -10%;
            right: -10%;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(50px, 30px); opacity: 0.9; }
        }

        /* === MODERN GLASS CARD CONTAINER === */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(0, 242, 254, 0.1);
            position: relative;
            z-index: 10;
        }

        /* === AUTH / LOGIN SECTION === */
        #auth-section {
            display: none; 
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-header { margin-bottom: 28px; }

        .auth-title {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--accent-cyan); /* Brightened for Bold */
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 45px !important; }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            text-align: left;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            position: relative;
        }

        .checkbox-group input[type="checkbox"]:checked {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .checkbox-group input[type="checkbox"]:checked::after {
            content: '✔';
            position: absolute;
            color: #000;
            font-size: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .checkbox-group label {
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple));
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(127, 0, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(127, 0, 255, 0.5);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }

        /* === MAIN DASHBOARD SECTION === */
        #dashboard-section {
            display: none; 
            width: 90%;
            max-width: 1100px;
            min-height: 580px;
            padding: 40px;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            align-items: center;
            height: 100%;
            gap: 40px;
        }

        .robot-container {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatRobot 5s ease-in-out infinite;
        }

        .robot-container img {
            width: 100%;
            max-width: 300px;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(0, 242, 254, 0.3));
        }

        .dashboard-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-center {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 20px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
        }

        .brand-title {
            font-size: 3.5rem;
            letter-spacing: 2px;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .welcome-msg {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .user-highlight { color: var(--accent-cyan); }

        .subtitle-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 35px;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 550px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .nav-btn {
            flex: 1;
            padding: 18px 24px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--border-glow);
            color: #fff;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(127, 0, 255, 0.2));
            border-color: var(--accent-cyan);
            transform: translateY(-4px);
        }

        /* Utility Controls (Backup/Signout) */
        .utility-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .secondary-btn {
            background: transparent;
            border: 2px solid;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-signout {
            border-color: rgba(255, 77, 77, 0.5);
            color: #ff4d4d;
        }
        .btn-signout:hover { background: #ff4d4d; color: #fff; }

        .btn-backup {
            border-color: rgba(46, 213, 115, 0.5);
            color: #2ed573;
        }
        .btn-backup:hover { background: #2ed573; color: #000; }

        /* ANIMATIONS */
        @keyframes floatRobot {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* === RESTYLED MOBILE VIEW (App-Like Bottom Sheet) === */
        @media (max-width: 900px) {
            body {
                align-items: flex-end; /* Push content to bottom */
                padding: 0;
            }

            /* Auth Section Mobile */
            #auth-section {
                width: 100%;
                max-width: 100%;
                border-radius: 35px 35px 0 0;
                padding: 40px 25px 50px 25px;
                border-bottom: none;
                border-left: none;
                border-right: none;
                border-top: 2px solid var(--accent-cyan);
                background: rgba(10, 12, 20, 0.95);
            }

            /* Dashboard Section Mobile */
            #dashboard-section {
                width: 100%;
                max-width: 100%;
                border-radius: 35px 35px 0 0;
                padding: 30px 20px 40px 20px;
                border-bottom: none;
                border-left: none;
                border-right: none;
                border-top: 2px solid var(--accent-cyan);
                background: rgba(10, 12, 20, 0.95);
                margin: 0;
            }

            /* Robot sits on top of the sheet */
            .dashboard-grid {
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            .robot-container {
                position: absolute;
                top: -120px;
                left: 50%;
                transform: translateX(-50%);
                animation: floatRobot 4s ease-in-out infinite;
            }

            .robot-container img {
                max-width: 140px;
                filter: drop-shadow(0 10px 15px rgba(0, 242, 254, 0.5));
            }

            .dashboard-center {
                margin-top: 30px; /* Space for the floating robot */
            }

            .brand-title { font-size: 2.4rem; }
            .welcome-msg { font-size: 1.3rem; }
            
            .logo-center { display: none; /* Hide logo on mobile to save space */ }

            .subtitle-text {
                font-size: 0.9rem;
                margin-bottom: 25px;
            }

            /* Grid for buttons on mobile (2 columns) */
            .action-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-bottom: 30px;
            }

            .nav-btn {
                padding: 15px 10px;
                font-size: 0.95rem;
                flex-direction: column; /* Stack icon and text */
                gap: 5px;
                text-align: center;
            }
            
            /* Make the 3rd button span full width if it's an odd number */
            .nav-btn:nth-child(3) {
                grid-column: span 2;
            }
        }
    </style>
</head>
<body>

    <div id="auth-section" class="glass-card">
        <div class="auth-header">
            <h2 class="auth-title">RML Partner</h2>
            <p class="auth-subtitle">Sign in or create your account</p>
        </div>
        <form id="auth-form">
            <div class="input-group">
                <label for="gmail">Gmail Address</label>
                <input type="email" id="gmail" placeholder="name@gmail.com" required>
            </div>
            <div class="input-group">
                <label for="nickname">Unique Nickname</label>
                <input type="text" id="nickname" placeholder="Choose nickname" required>
            </div>
            <div class="input-group">
                <label for="password">Password (8+ chars)</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" id="toggle-password-btn" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
                </div>
            </div>
            
            <div class="checkbox-group" onclick="toggleCheckbox(event)">
                <input type="checkbox" id="remember-me" checked>
                <label for="remember-me">Remember my details</label>
            </div>

            <div id="error-msg" class="error-msg"></div>
            <button type="submit" class="btn-primary">Access Dashboard</button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">Switching devices?</p>
            <input type="file" id="import-db-input" accept=".json" style="display: none;" onchange="restoreDatabase(event)">
            <button class="secondary-btn btn-backup" style="width: 100%; border: 1px dashed;" onclick="document.getElementById('import-db-input').click()">📥 Restore Account Data</button>
        </div>
    </div>

    <div id="dashboard-section" class="glass-card">
        <div class="dashboard-grid">
            
            <div class="robot-container">
                <img src="robot.png" alt="Robot Partner" onerror="this.style.display='none'">
            </div>

            <div class="dashboard-center">
                <img src="logo.png" alt="RML Logo" class="logo-center" onerror="this.src='https://via.placeholder.com/90/00f2fe/ffffff?text=LOGO'">
                
                <h1 class="brand-title">RML Partner</h1>
                <h2 class="welcome-msg">Welcome, <span id="display-nickname" class="user-highlight"></span>!</h2>
                <p class="subtitle-text">Select a service category below to manage your operations.</p>

                <div class="action-buttons">
                    <button class="nav-btn" onclick="window.location.href='grocery.html'">
                        <span>🛒</span> Grocery Stock
                    </button>
                    <button class="nav-btn" onclick="window.location.href='reminder.html'">
                        <span>⏰</span> Reminder
                    </button>
                    <button class="nav-btn" onclick="window.location.href='macaddresses.html'">
                        <span>🛜</span> MAC Addresses
                    </button>
                </div>

                <div class="utility-controls">
                    <button class="secondary-btn btn-backup" onclick="backupDatabase()">💾 Backup Accounts</button>
                    <button class="secondary-btn btn-signout" onclick="signOut()">Sign Out</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Database Initialization
        let usersDB = {};
        try {
            usersDB = JSON.parse(localStorage.getItem('app_users')) || {};
        } catch (e) {
            usersDB = {};
        }
        
        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const authForm = document.getElementById('auth-form');
        const errorMsg = document.getElementById('error-msg');
        const displayNickname = document.getElementById('display-nickname');
        
        const emailInput = document.getElementById('gmail');
        const nicknameInput = document.getElementById('nickname');
        const passwordInput = document.getElementById('password');
        const rememberMeCheck = document.getElementById('remember-me');

        function toggleCheckbox(e) {
            if(e.target.tagName !== 'INPUT') {
                rememberMeCheck.checked = !rememberMeCheck.checked;
            }
        }

        function togglePasswordVisibility() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                document.getElementById('toggle-password-btn').textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                document.getElementById('toggle-password-btn').textContent = '👁️';
            }
        }

        function initializeApp() {
            const activeSession = localStorage.getItem('active_user');
            
            if (activeSession && usersDB[activeSession]) {
                showDashboardView(usersDB[activeSession].nickname);
            } else {
                showLoginView();
                const rememberedEmail = localStorage.getItem('remembered_email');
                const rememberedNickname = localStorage.getItem('remembered_nickname');
                
                if (rememberedEmail && rememberedNickname) {
                    emailInput.value = rememberedEmail;
                    nicknameInput.value = rememberedNickname;
                    rememberMeCheck.checked = true;
                }
            }
        }

        authForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = emailInput.value.trim().toLowerCase();
            const nickname = nicknameInput.value.trim();
            const password = passwordInput.value;

            errorMsg.style.display = 'none';

            if (password.length < 8) {
                showError("Password must be at least 8 characters long.");
                return;
            }

            if (usersDB[email]) {
                const user = usersDB[email];
                if (user.password === password && user.nickname.toLowerCase() === nickname.toLowerCase()) {
                    processLogin(email, user.nickname);
                } else {
                    showError("Invalid credentials or nickname mismatch.");
                }
            } else {
                let isNicknameTaken = false;
                for (let existingEmail in usersDB) {
                    if (usersDB[existingEmail].nickname.toLowerCase() === nickname.toLowerCase()) {
                        isNicknameTaken = true;
                        break;
                    }
                }

                if (isNicknameTaken) {
                    showError("Nickname already taken. Please choose another.");
                } else {
                    usersDB[email] = { nickname: nickname, password: password, savedData: {} };
                    localStorage.setItem('app_users', JSON.stringify(usersDB));
                    processLogin(email, nickname);
                }
            }
        });

        function processLogin(email, nickname) {
            if (rememberMeCheck.checked) {
                localStorage.setItem('remembered_email', email);
                localStorage.setItem('remembered_nickname', nickname);
            } else {
                localStorage.removeItem('remembered_email');
                localStorage.removeItem('remembered_nickname');
            }
            localStorage.setItem('active_user', email);
            showDashboardView(nickname);
        }

        function signOut() {
            localStorage.removeItem('active_user');
            passwordInput.value = ''; 
            passwordInput.type = 'password';
            document.getElementById('toggle-password-btn').textContent = '👁️';
            
            if (!localStorage.getItem('remembered_email')) {
                emailInput.value = '';
                nicknameInput.value = '';
            }
            showLoginView();
        }

        function showDashboardView(nickname) {
            authSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            displayNickname.textContent = nickname;
        }

        function showLoginView() {
            dashboardSection.style.display = 'none';
            authSection.style.display = 'block';
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        // --- NEW FEATURE: BACKUP & RESTORE DATABASE ---
        // This guarantees accounts are NEVER lost, even if cache is cleared or devices change.
        
        function backupDatabase() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(usersDB));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href",     dataStr);
            downloadAnchorNode.setAttribute("download", "RML_Accounts_Backup.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            alert("Accounts Database Downloaded Successfully! Keep this file safe.");
        }

        function restoreDatabase(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedDB = JSON.parse(e.target.result);
                    if (typeof importedDB === 'object') {
                        // Merge databases
                        usersDB = { ...usersDB, ...importedDB };
                        localStorage.setItem('app_users', JSON.stringify(usersDB));
                        alert("Accounts Database Restored Successfully! You can now log in.");
                    }
                } catch (err) {
                    alert("Invalid Backup File!");
                }
                event.target.value = ''; // Reset input
            };
            reader.readAsText(file);
        }

        initializeApp();
    </script>

   <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    console.log('Service Worker registered successfully');
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        });
    }
</script>
</body>
</html>
